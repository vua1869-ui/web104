<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiến Anh</title>
    <link rel="stylesheet" href="slyte.css">
<style>
    /*h2 là thẻ được chọn để định danh*/
    h2 {
        color:brown;

    }

</style>
</head>

<body>
    <h1>tim hieu ve CSS</h1>
    <!--1. Vai tro cua css: dung de dinh dang va thiet ke giao dien web
    -Css giup thay doi
    +mau sac dont chu
    +kich thuoc
    +khoang cach
    +bo cuc, vi tri cac thanh phan
    
    2 vo tri dat ma css
    -dat truc tiep trong file html:dùng khi ít mã
    +khi đặt trực tiếp trong file html chúng ta cần sử dụng các thử style
    -viết trực tiếp trong thẻ cần địng dạng 
    
    -tách thành file css riêng
    -->
<h2>Tiêu đều 2</h2>
<h3 style="color:coral; background: black;">Tiêu đề 3</h3>
<h4>dcm nhìn con cac</h4>
<h4 class="class1">hom nay trời đẹp</h4> </h4>
<h4 id="id1">bỏ chọn selector</h4>
<!--sử dụng selocor(bo chon) để chọn va địng dạng các thẻ khác nhau
+ chọn Tag name vd:hi,h2,h3...
+đặt tên bằng cách sử dụng thuộc tính class vd:class1, class2...
+ đặt địng dạng bằng thuộc tính vd:#id1, #id2,#id3, -->    
</body>

</html>
